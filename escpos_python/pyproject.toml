[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "escpos-python"
version = "1.0.0"
description = "Python library for ESC/POS-compatible thermal and impact receipt printers"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Michael Billington", email = "michael.billington@gmail.com"}
]
maintainers = [
    {name = "escpos-python contributors"}
]
keywords = ["escpos", "printer", "thermal", "receipt", "pos", "point-of-sale"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Printing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.8"
dependencies = [
    "pillow>=9.0.0",
]

[project.optional-dependencies]
usb = ["pyusb>=1.2.0"]
serial = ["pyserial>=3.5"]
cups = ["pycups>=2.0.1"]
barcode = ["python-barcode>=0.14"]
qrcode = ["qrcode>=7.3"]
all = [
    "pyusb>=1.2.0",
    "pyserial>=3.5",
    "python-barcode>=0.14",
    "qrcode>=7.3",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "mypy>=0.990",
]

[project.urls]
Homepage = "https://github.com/mike42/escpos-php"
Documentation = "https://github.com/mike42/escpos-php"
Repository = "https://github.com/mike42/escpos-php"

[tool.setuptools.packages.find]
where = ["."]
include = ["escpos*"]

[tool.setuptools.package-data]
escpos = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
